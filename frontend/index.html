<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisyphus Dashboard</title>
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background Elements -->
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
    
    <div class="container">
        <!-- Glassmorphism Header -->
        <header class="glass-panel">
            <div class="logo">
                <div class="pulse-dot"></div>
                <h1>Sisyphus</h1>
            </div>
            <p>Monitor your services with zero cold starts.</p>
        </header>

        <main>
            <!-- Form Section -->
            <section class="glass-panel add-service-section">
                <h2>Add New Service</h2>
                <form id="serviceForm">
                    <div class="input-group">
                        <label for="name">Service Name</label>
                        <input type="text" id="name" placeholder="e.g. Production API" required>
                    </div>
                    <div class="input-group">
                        <label for="url">Target URL</label>
                        <input type="url" id="url" placeholder="https://api.example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="interval">Interval (Minutes)</label>
                        <input type="number" id="interval" value="5" min="1" required>
                    </div>
                    <button type="submit" class="primary-btn">Start Monitoring</button>
                </form>
            </section>

            <!-- Display Section -->
            <section class="glass-panel services-list-section">
                <div class="section-header">
                    <h2>Active Services</h2>
                    <button id="refreshBtn" class="icon-btn" title="Refresh">↻</button>
                </div>
                <div id="servicesGrid" class="services-grid">
                    <!-- Cards will be injected here by Javascript -->
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
