services:
  # 1. The Monolithic FastAPI Web Server (Runs API, Worker, and Scheduler for Free)
  - type: web
    name: sisyphus-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # 2. React Frontend (Free Static Site)
  - type: web
    name: sisyphus-frontend
    env: static
    buildCommand: "cd client && npm install && npm run build"
    staticPublishPath: "./client/dist"
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
